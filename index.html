<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#100d19">
<title>HŨ CLUB • Mobile Arcade</title>
<style>
:root{--bg:#100d19;--panel:#20182d;--cell:#332444;--gold:#ffd166;--purple:#9b5de5;--pink:#ff4fa3;--cyan:#51e5ff;--green:#68e59b;--muted:#b7a9c9;--white:#fff8f0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2c1742 0,#100d19 55%);color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;color:#170f20;background:var(--gold);box-shadow:0 3px 0 #956b21;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:none}.secondary{background:var(--purple);color:white;box-shadow:0 3px 0 #59358b}.pink{background:var(--pink);color:#251021;box-shadow:0 3px 0 #92305e}.green{background:var(--green);box-shadow:0 3px 0 #277a4c}.mutedbtn{background:#49395b;color:white;box-shadow:none}
.hidden{display:none!important}.wrap{max-width:520px;margin:auto;min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#1b1327ee;border-bottom:1px solid #ffffff14;backdrop-filter:blur(12px)}.brand{font-weight:1000;font-size:20px;color:var(--gold);letter-spacing:1px}.balance{font-size:14px;color:var(--green);font-weight:900;background:#10271e;padding:8px 10px;border-radius:10px}.ticker{overflow:hidden;white-space:nowrap;background:#392044;color:var(--gold);padding:8px 0;font-size:11px;font-weight:900}.ticker span{display:inline-block;padding-left:100%;animation:marquee 13s linear infinite}@keyframes marquee{to{transform:translateX(-100%)}}
main{padding:16px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--cyan);font-weight:900}.title{font-size:25px;font-weight:1000;margin:5px 0}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin:5px 0 16px}.panel{background:linear-gradient(145deg,#2a203b,#1b1527);border:1px solid #ffffff14;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 12px 30px #0003}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px;background:#ffffff08;border:1px solid #ffffff10;border-radius:13px}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:800}.stat strong{display:block;color:var(--gold);font-size:19px;margin-top:5px}.gamecard{padding:17px;border-radius:17px;margin:11px 0;background:linear-gradient(120deg,#302044,#1d1729);border:1px solid #ffffff16}.gamecard h3{margin:0 0 5px;font-size:18px}.gamecard p{color:var(--muted);font-size:12px;margin:0 0 14px}.gamecard button{width:100%}.mah h3{color:#d9a7ff}.battle h3{color:var(--pink)}.cards h3{color:var(--cyan)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:#1b1327f5;border-top:1px solid #ffffff18;z-index:5;backdrop-filter:blur(12px)}.nav button{padding:8px 2px;background:transparent;color:var(--muted);box-shadow:none;font-size:10px;border-radius:9px}.nav button.active{background:#3b2b4e;color:var(--gold)}.nav span{display:block;font-size:18px;margin-bottom:2px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.loginbox{width:100%;max-width:380px}.logo{text-align:center;color:var(--gold);font-weight:1000;font-size:34px;letter-spacing:2px}.tag{text-align:center;color:var(--cyan);font-size:11px;font-weight:900;margin:5px 0 25px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.betinput{width:100%;border:1px solid #ffffff20;background:#120e1c;color:white;border-radius:10px;padding:13px;outline:none}.field input:focus,.betinput:focus{border-color:var(--purple)}.loginbox button{width:100%;margin-top:10px}.tiny{font-size:10px;color:var(--muted);line-height:1.5}
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{background:#402b54;color:var(--gold);border-radius:100px;padding:7px 10px;font-size:10px;font-weight:900;white-space:nowrap}.slotbox{background:linear-gradient(145deg,#5d3574,#2a193e);padding:7px;border:2px solid #d9a7ff;border-radius:17px;box-shadow:0 0 24px #9b5de52b}.slotgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.tile{min-width:0;aspect-ratio:1/1.12;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(145deg,#fff4dc,#d8bfc7);border:2px solid #f7d98a;color:#362344;font-size:clamp(21px,7vw,34px);font-weight:900;text-shadow:0 1px #fff;transition:transform .16s,filter .16s;user-select:none}.tile.spin{animation:blink .18s alternate infinite}.tile.win{background:linear-gradient(145deg,#76ffc0,#1f9a6b);border-color:#e5fff1;color:#092a1c;animation:pop .35s ease-in-out 2;box-shadow:0 0 16px #68e59b99}.tile.scatter{background:linear-gradient(145deg,#ff92c7,#a32d78);border-color:#ffe1f0;color:#390c2a}@keyframes blink{from{transform:scale(.96);filter:brightness(.85)}to{transform:scale(1.04);filter:brightness(1.25)}}@keyframes pop{50%{transform:scale(1.09)}}.betrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin:12px 0}.betrow label{font-size:11px;color:var(--muted);font-weight:800}.betinput{margin-top:5px;padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{width:100%}.result{min-height:46px;text-align:center;font-weight:900;font-size:13px;padding:12px 7px;color:var(--cyan)}.paytable{display:flex;flex-wrap:wrap;gap:6px}.paytable span{background:#ffffff0d;border:1px solid #ffffff14;padding:6px 8px;border-radius:8px;font-size:10px;color:var(--muted)}.notice{font-size:10px;color:var(--muted);text-align:center;line-height:1.5;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row+.row{margin-top:10px}.row strong{font-size:13px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.row button{font-size:11px;padding:10px}.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:9;background:#2d2240;border:1px solid #ffffff20;color:white;padding:11px 15px;border-radius:12px;box-shadow:0 8px 30px #0008;font-size:12px;font-weight:800;max-width:90%;text-align:center}.cardsboard{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.playingcard{height:130px;border-radius:14px;background:#fff5df;color:#21152b;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:1000;border:3px solid #eacb7a}
</style>
</head>
<body>
<section id="login" class="login">
 <div class="loginbox">
  <div class="logo">✦ HŨ CLUB ✦</div><div class="tag">MOBILE SLOT ARCADE</div>
  <div class="panel">
   <h2 style="margin:0 0 15px">Đăng nhập</h2>
   <div class="field"><label>Tài khoản</label><input id="username" value="admin" autocomplete="username"></div>
   <div class="field"><label>Mật khẩu</label><input id="password" value="1234" type="password" autocomplete="current-password"></div>
   <button onclick="login()">VÀO SẢNH　➜</button>
   <p class="tiny" style="text-align:center;margin:14px 0 0">Demo: admin / 1234</p>
  </div>
  <p class="tiny" style="text-align:center">✦ BẢO NGU NHƯ BÒ ✦<br>Chơi vui bằng điểm ảo</p>
 </div>
</section>
<div id="app" class="wrap hidden">
 <header class="top"><div class="brand">✦ HŨ CLUB</div><div class="balance" id="balance">10,000 điểm</div></header>
 <div class="ticker"><span>✦ BẢO NGU NHƯ BÒ ✦　 JACKPOT　 •　 BONUS　 •　 FREE SPIN　 •　 CHƠI VUI BẰNG ĐIỂM ẢO　 ✦</span></div>
 <main id="main"></main>
 <nav class="nav">
  <button data-page="home" onclick="home()" class="active"><span>⌂</span>Sảnh</button>
  <button data-page="mahjong" onclick="openGame('mahjong')"><span>🀄</span>Mạt chược</button>
  <button data-page="battle" onclick="openGame('battle')"><span>⚔️</span>Quyết chiến</button>
  <button data-page="points" onclick="pointsPage()"><span>＋</span>Điểm</button>
  <button data-page="profile" onclick="profilePage()"><span>◉</span>Cá nhân</button>
 </nav>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);
let user="",isAdmin=false,balance=10000,totalPlayed=0,totalWon=0,freeSpins=0,currentGame="mahjong",spinning=false,toastTimer;
function fmt(n){return Math.floor(n).toLocaleString("en-US")}
function updateBalance(){if($("balance"))$("balance").textContent=fmt(balance)+" điểm"}
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),2300)}
function login(){let u=$("username").value.trim(),p=$("password").value;if(!u||!p){toast("Nhập tài khoản và mật khẩu nhé");return}if(u==="admin"&&p==="1234"){isAdmin=true}else{isAdmin=false}user=u;$("login").classList.add("hidden");$("app").classList.remove("hidden");updateBalance();home()}
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
function navActive(page){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function home(){navActive("home");$("main").innerHTML=`
 <div class="eyebrow">CHÀO MỪNG ĐẾN HŨ CLUB</div><div class="title">Sảnh game ✦</div><p class="sub">Arcade mini • Điểm thưởng ảo • Tối ưu màn hình điện thoại</p>
 <div class="stats"><div class="stat"><small>SỐ DƯ ĐIỂM ẢO</small><strong>${fmt(balance)}</strong></div><div class="stat"><small>TỔNG LƯỢT CHƠI</small><strong>${totalPlayed}</strong></div><div class="stat"><small>TỔNG ĐIỂM THẮNG</small><strong>${fmt(totalWon)}</strong></div><div class="stat"><small>FREE SPIN</small><strong>${freeSpins}</strong></div></div>
 <div class="gamecard mah"><h3>🀄 MẠT CHƯỢC</h3><p>Lưới 5×3 • Trúng cụm biểu tượng • Tối đa x10</p><button onclick="openGame('mahjong')">CHƠI NGAY　➜</button></div>
 <div class="gamecard battle"><h3>⚔️ QUYẾT CHIẾN</h3><p>Scatter • 10 lượt miễn phí • Hệ số từ x8</p><button class="pink" onclick="openGame('battle')">VÀO QUYẾT CHIẾN　➜</button></div>
 <div class="gamecard cards"><h3>♠ GAME BÀI</h3><p>Rút bài so điểm với máy • Thắng nhận x2</p><button class="secondary" onclick="cardsPage()">CHƠI BÀI　➜</button></div>
 <div class="panel"><b style="color:var(--gold)">🎁 Khuyến mãi</b><p class="sub" style="margin:7px 0 0">Điểm tân thủ demo • Scatter may mắn • Game hoàn toàn dùng điểm ảo.</p></div>`}
function openGame(mode){currentGame=mode;navActive(mode);const battle=mode==="battle";const title=battle?"⚔️ QUYẾT CHIẾN":"🀄 MẠT CHƯỢC";const subtitle=battle?"Lưới 5×3 • 3 Scatter trở lên nhận 10 Free Spin • Free Spin từ x8":"Lưới 5×3 • Cụm 3+ biểu tượng liền nhau theo hàng • Tối đa x10";$("main").innerHTML=`
 <div class="gamehead"><div><div class="eyebrow">SLOT ARCADE</div><div class="title">${title}</div></div><span class="pill">${battle?"SCATTER BONUS":"MAX x10"}</span></div>
 <p class="sub">${subtitle}</p><div class="panel" style="padding:10px">
 <div class="slotbox"><div class="slotgrid" id="slotgrid"></div></div>
 <div class="result" id="result">Chạm QUAY để bắt đầu!</div>
 <div class="betrow"><label>MỨC CƯỢC<input id="bet" class="betinput" type="number" min="1" step="10" value="100"></label><div style="text-align:right"><small style="color:var(--muted)">FREE SPIN</small><div id="frees" style="font-size:23px;font-weight:1000;color:var(--pink)">${freeSpins}</div></div></div>
 <div class="actions"><button onclick="spin()">🎰 QUAY</button><button class="secondary" onclick="freeSpin()" ${battle?"":"disabled"}>✦ FREE SPIN</button></div></div>
 <div class="panel"><div style="font-weight:900;color:var(--gold);margin-bottom:9px">BẢNG THƯỞNG</div><div class="paytable">${(battle?["3 Scatter = +10 Free","Free Spin tối thiểu x8","Cụm 3+ = thưởng"]:["3 giống nhau = x3","4 giống nhau = x6","5 giống nhau = x10","Tối đa x10"]).map(x=>`<span>${x}</span>`).join("")}</div></div>
 <p class="notice">Đây là trò chơi mô phỏng ngoại tuyến. Điểm và thưởng chỉ có giá trị trong bản demo, không nạp/rút tiền thật.</p>`;
 makeTiles(Array(15).fill("✦"),[])}
function makeTiles(symbols,wins=[],scatters=[]){const grid=$("slotgrid");if(!grid)return;grid.innerHTML="";symbols.forEach((s,i)=>{let d=document.createElement("div");d.className="tile"+(wins.includes(i)?" win":"")+(scatters.includes(i)?" scatter":"");d.textContent=s;grid.appendChild(d)})}
function betValue(){let b=Number($("bet")?.value);if(!Number.isInteger(b)||b<1||b>balance){toast("Mức cược không hợp lệ hoặc số dư không đủ");return null}return b}
function randomGrid(pool){return Array.from({length:15},()=>pool[Math.floor(Math.random()*pool.length)])}
function findWins(a){let wins=[],mult=0;for(let r=0;r<3;r++){let c=0;while(c<5){let start=c;while(c+1<5&&a[r*5+c]===a[r*5+c+1])c++;let len=c-start+1;if(len>=3&&a[r*5+start]!=="SC"){for(let k=start;k<=c;k++)wins.push(r*5+k);mult+=len===3?3:len===4?6:10}c++}}return {wins:[...new Set(wins)],mult:Math.min(10,mult)}}
function spin(){if(spinning)return;const b=betValue();if(b===null)return;if(currentGame==="battle"&&freeSpins>0){toast("Bạn có Free Spin! Bấm nút FREE SPIN để dùng.");}
 balance-=b;totalPlayed++;const battle=currentGame==="battle";const pool=battle?["⚔️","♦️","⭐","✦","👑","SC","7"]:["🀄","🀇","🀙","♦️","⭐","7","✦"];const a=randomGrid(pool);const {wins}=findWins(a);let mult=0,scatter=[];if(battle){scatter=a.map((s,i)=>s==="SC"?i:-1).filter(i=>i>=0);if(scatter.length>=3){freeSpins+=10;wins.push(...scatter);$("result").textContent="SCATTER! +10 FREE SPIN";}else{$("result").textContent="Đang tính thưởng..."}}
 const found=findWins(a);mult=found.mult;if(battle)mult=Math.min(1064,mult*2);const prize=b*mult;balance+=prize;totalWon+=prize;updateBalance();$("frees").textContent=freeSpins;
 const grid=$("slotgrid");if(grid){grid.querySelectorAll(".tile").forEach(t=>t.classList.add("spin"));setTimeout(()=>{if(!$("slotgrid"))return;makeTiles(a,[...new Set([...found.wins,...(battle&&scatter.length>=3?scatter:[])])],scatter);$("result").textContent=scatter.length>=3?"SCATTER! +10 FREE SPIN":(mult?`TRÚNG CỤM • x${mult} • +${fmt(prize)} điểm`:`CHƯA TRÚNG • x0`);$("result").style.color=mult? "var(--green)":"var(--muted)";spinning=false},500);spinning=true}
}
function freeSpin(){if(currentGame!=="battle"){toast("Free Spin chỉ dùng ở Quyết chiến");return}if(freeSpins<=0){toast("Chưa có Free Spin. Cần 3 Scatter trở lên.");return}if(spinning)return;freeSpins--;totalPlayed++;const base=Math.max(1,Math.floor(Number($("bet").value)||100));const a=randomGrid(["⚔️","♦️","⭐","✦","👑","SC","7"]);const {wins}=findWins(a);let mult=Math.max(8,Math.min(1064,findWins(a).mult*2||8));const prize=base*mult;balance+=prize;totalWon+=prize;updateBalance();$("frees").textContent=freeSpins;makeTiles(a,wins,a.map((s,i)=>s==="SC"?i:-1).filter(i=>i>=0));$("result").textContent=`FREE SPIN • x${mult} • +${fmt(prize)} điểm • Còn ${freeSpins}`;$("result").style.color="var(--green)"}
function cardsPage(){navActive("");$("main").innerHTML=`<div class="eyebrow">ARCADE</div><div class="title">♠ Game bài</div><p class="sub">Rút một lá bài và so điểm với máy. A cao nhất.</p><div class="panel"><div class="cardsboard"><div id="pc" class="playingcard">🂠</div><b style="color:var(--gold)">VS</b><div id="cc" class="playingcard">🂠</div></div><label style="display:block;color:var(--muted);font-size:11px;margin:16px 0 5px">MỨC CƯỢC</label><input id="cardbet" class="betinput" type="number" value="100" min="1"><button style="width:100%;margin-top:12px" onclick="playCards()">🃏 RÚT BÀI</button><div class="result" id="cardresult">Sẵn sàng?</div></div>`}
function playCards(){const b=Number($("cardbet").value);if(!Number.isInteger(b)||b<1||b>balance){toast("Mức cược không hợp lệ");return}balance-=b;totalPlayed++;const p=2+Math.floor(Math.random()*13),c=2+Math.floor(Math.random()*13),s=["♠","♥","♦","♣"];const name=n=>({11:"J",12:"Q",13:"K",14:"A"}[n]||n);const ps=s[Math.floor(Math.random()*4)],cs=s[Math.floor(Math.random()*4)];$("pc").textContent=name(p)+ps;$("cc").textContent=name(c)+cs;$("pc").style.color=["♥","♦"].includes(ps)?"#d5264f":"#21152b";$("cc").style.color=["♥","♦"].includes(cs)?"#d5264f":"#21152b";let msg;if(p>c){balance+=b*2;totalWon+=b*2;msg=`BẠN THẮNG +${fmt(b*2)} điểm`;$("cardresult").style.color="var(--green)"}else if(p===c){balance+=b;msg="HÒA • HOÀN CƯỢC";$("cardresult").style.color="var(--gold)"}else{msg="MÁY THẮNG LƯỢT NÀY";$("cardresult").style.color="var(--pink)"}$("cardresult").textContent=msg;updateBalance()}
function pointsPage(){navActive("points");$("main").innerHTML=`<div class="eyebrow">VÍ ĐIỂM</div><div class="title">＋ Điểm demo</div><p class="sub">Nhận điểm ảo để trải nghiệm. Không xử lý thanh toán thật.</p><div class="panel">${[1000,5000,10000].map(n=>`<div class="row"><div><strong>${fmt(n)} điểm ảo</strong><small>Gói trải nghiệm miễn phí</small></div><button onclick="addPoints(${n})">NHẬN</button></div>`).join("")}${isAdmin?`<div class="row" style="border-top:1px solid #ffffff18;padding-top:14px"><div><strong>Admin cộng điểm</strong><small>Chỉ cộng điểm ảo trong phiên này</small></div><button class="green" onclick="adminAdd()">＋ CỘNG</button></div>`:""}</div>`}
function addPoints(n){balance+=n;updateBalance();toast("Đã cộng "+fmt(n)+" điểm ảo");pointsPage()}
function adminAdd(){if(!isAdmin){toast("Không có quyền admin");return}let n=Number(prompt("Nhập số điểm ảo cần cộng:","1000"));if(Number.isInteger(n)&&n>0&&n<=100000000){balance+=n;updateBalance();toast("Admin đã cộng "+fmt(n)+" điểm");profilePage()}}
function profilePage(){navActive("profile");$("main").innerHTML=`<div class="eyebrow">TÀI KHOẢN</div><div class="title">◉ Cá nhân</div><div class="panel"><div class="row"><div><strong>Tài khoản</strong><small>${escapeHtml(user)}</small></div></div><div class="row"><div><strong>Vai trò</strong><small>${isAdmin?"ADMIN":"NGƯỜI CHƠI"}</small></div></div><div class="row"><div><strong>Số dư</strong><small>${fmt(balance)} điểm ảo</small></div></div><div class="row"><div><strong>Tổng lượt chơi</strong><small>${totalPlayed}</small></div></div><div class="row"><div><strong>Tổng điểm thưởng</strong><small>${fmt(totalWon)}</small></div></div>${isAdmin?`<button class="green" style="width:100%;margin-top:15px" onclick="adminAdd()">＋ ADMIN CỘNG ĐIỂM</button>`:""}<button class="mutedbtn" style="width:100%;margin-top:10px" onclick="logout()">ĐĂNG XUẤT</button></div><div class="panel"><b style="color:var(--gold)">🎁 Khuyến mãi</b><p class="sub">Tân thủ demo • Scatter bonus • Game dùng điểm ảo.</p></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function logout(){$("app").classList.add("hidden");$("login").classList.remove("hidden");$("password").value="1234"}
</script>
</body>
</html>
